name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: build, sign, notarize and check the DMG, but publish nothing.
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the dry-run build
        default: "0.0.0"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    timeout-minutes: 150
    env:
      APP_NAME: Tallshot
      # Signing and notarizing turn on automatically when these repository secrets exist.
      # Without them the release is ad hoc signed (first launch needs "Open Anyway").
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v5

      - name: Version from tag
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then V="$INPUT_VERSION"; else V="${GITHUB_REF_NAME#v}"; fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # 0.x versions are early previews: published as GitHub pre-releases.
          case "$V" in 0.*) echo "prerelease=--prerelease" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=" >> "$GITHUB_OUTPUT" ;; esac

      - name: Tests (engine and offscreen harness)
        run: swift test -c release --package-path Packages/TallshotCore

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          sed "s/YOURTEAMID/$TEAM_ID/" Config/Signing.xcconfig.example > Config/Signing.xcconfig

      - name: Build (Release)
        run: |
          brew install xcodegen
          xcodegen generate
          xcodebuild -project Tallshot.xcodeproj -scheme Tallshot \
            -configuration Release -destination "generic/platform=macOS" \
            -derivedDataPath build.nosync/dd MARKETING_VERSION="${{ steps.v.outputs.version }}" build
          mkdir -p dist
          ditto "build.nosync/dd/Build/Products/Release/$APP_NAME.app" "dist/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "dist/$APP_NAME.app"
          scripts/check-privacy.sh "dist/$APP_NAME.app"

      - name: Write App Store Connect API key
        if: env.HAS_NOTARY == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Notarize and staple the app
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "dist/$APP_NAME.app" "$RUNNER_TEMP/notarize-app.zip"
          scripts/notarize.sh "$RUNNER_TEMP/notarize-app.zip" "dist/$APP_NAME.app"

      - name: Package DMG
        run: |
          V="${{ steps.v.outputs.version }}"
          scripts/make-dmg.sh "dist/$APP_NAME.app" "dist/Tallshot-$V.dmg"
          if [ "$HAS_SIGNING" = "true" ]; then
            codesign --sign "Developer ID Application" --timestamp "dist/Tallshot-$V.dmg"
          fi

      - name: Notarize and staple the DMG
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          scripts/notarize.sh "dist/Tallshot-${{ steps.v.outputs.version }}.dmg"

      - name: Verify Developer ID signature and notarization
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        run: |
          V="${{ steps.v.outputs.version }}"
          codesign -dv --verbose=2 "dist/$APP_NAME.app" 2>&1 | grep -E "^Authority|flags="
          spctl --assess --type execute --verbose=2 "dist/$APP_NAME.app"
          spctl --assess --type open --context context:primary-signature --verbose=2 "dist/Tallshot-$V.dmg"
          xcrun stapler validate "dist/$APP_NAME.app"
          xcrun stapler validate "dist/Tallshot-$V.dmg"

      - name: Checksums
        run: (cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Release notes
        run: |
          cp docs/RELEASE_NOTES.md dist/notes.md
          if [ "$HAS_SIGNING" != "true" ] || [ "$HAS_NOTARY" != "true" ]; then
            printf '\n' >> dist/notes.md
            cat docs/UNSIGNED_NOTE.md >> dist/notes.md
          fi

      - name: Publish GitHub release (skipped if the release already exists)
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it as published."
            exit 0
          fi
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS.txt ${{ steps.v.outputs.prerelease }} \
            --title "Tallshot ${{ steps.v.outputs.version }}" --notes-file dist/notes.md
