name: Release

on:
  push:
    tags: ["v*"]
  # Dry run: build, sign, notarize and check the DMG, but publish nothing.
  workflow_dispatch:
    inputs:
      version:
        description: Version to stamp into the dry-run build
        default: "0.0.0"

# Read-only unless a job asks for more. Only the publish job can write (to create the release).
permissions:
  contents: read

jobs:
  # Tests, builds, signs, notarizes and checks the DMG, then hands dist/ to the publish job.
  # It can't change the repository: its token is read-only and isn't left in .git/config.
  build:
    runs-on: macos-latest
    timeout-minutes: 150
    permissions:
      contents: read
    outputs:
      version: ${{ steps.v.outputs.version }}
      prerelease: ${{ steps.v.outputs.prerelease }}
    env:
      APP_NAME: Tallshot
      # Signing and notarizing turn on automatically when these repository secrets exist.
      # Without them the release is ad hoc signed (first launch needs "Open Anyway").
      HAS_SIGNING: ${{ secrets.MACOS_CERTIFICATE_P12 != '' && secrets.APPLE_TEAM_ID != '' }}
      HAS_NOTARY: ${{ secrets.APPLE_API_KEY_ID != '' && secrets.APPLE_API_ISSUER_ID != '' && secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          persist-credentials: false

      # The version comes from the tag or the dry-run input. It must look like 1.2.3 or
      # 1.2.3-beta.1 before anything uses it; later steps read it only as "$VERSION".
      - name: Version from tag
        id: v
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then V="$INPUT_VERSION"; else V="${GITHUB_REF_NAME#v}"; fi
          if ! printf '%s' "$V" | grep -Eqx '[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?' || [ "$(printf '%s' "$V" | wc -l)" -ne 0 ]; then
            echo "::error::Version must look like 1.2.3 or 1.2.3-beta.1"
            exit 1
          fi
          echo "version=$V" >> "$GITHUB_OUTPUT"
          # 0.x versions are previews, published as GitHub pre-releases; 1.0 and later are full releases.
          case "$V" in 0.*) echo "prerelease=true" >> "$GITHUB_OUTPUT" ;; *) echo "prerelease=false" >> "$GITHUB_OUTPUT" ;; esac

      # Full releases say "signed and notarized" in their notes, so they stop here without the secrets.
      - name: A full release must be signed and notarized
        if: steps.v.outputs.prerelease == 'false' && (env.HAS_SIGNING != 'true' || env.HAS_NOTARY != 'true')
        run: |
          echo "::error::Versions 1.0 and later need all six signing and notarizing secrets."
          exit 1

      # Every tool from outside macOS is installed now, before the signing key exists on this
      # machine, so none of it can ever run while the key is unlocked.
      - name: Install XcodeGen (pinned version, checksum checked)
        run: |
          BIN="$(scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen")"
          echo "$BIN" >> "$GITHUB_PATH"

      - name: Tests (engine and offscreen harness)
        run: swift test -c release --package-path Packages/TallshotCore

      - name: Generate the Xcode project
        run: xcodegen generate

      - name: Import Developer ID certificate
        if: env.HAS_SIGNING == 'true'
        env:
          P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          P12_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
          TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          KEYCHAIN="$RUNNER_TEMP/signing.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          echo "$P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" $(security list-keychains -d user | tr -d '"')
          rm "$RUNNER_TEMP/cert.p12"
          sed "s/YOURTEAMID/$TEAM_ID/" Config/Signing.xcconfig.example > Config/Signing.xcconfig

      - name: Build (Release)
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          xcodebuild -project Tallshot.xcodeproj -scheme Tallshot \
            -configuration Release -destination "generic/platform=macOS" \
            -derivedDataPath build.nosync/dd MARKETING_VERSION="$VERSION" build
          mkdir -p dist
          ditto "build.nosync/dd/Build/Products/Release/$APP_NAME.app" "dist/$APP_NAME.app"
          codesign --verify --deep --strict --verbose=2 "dist/$APP_NAME.app"
          scripts/check-privacy.sh "dist/$APP_NAME.app"
          scripts/test-version.sh "dist/$APP_NAME.app"

      - name: Write App Store Connect API key
        if: env.HAS_NOTARY == 'true'
        env:
          ASC_KEY_P8: ${{ secrets.APPLE_API_KEY_P8 }}
        run: |
          printf '%s\n' "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          chmod 600 "$RUNNER_TEMP/AuthKey.p8"

      - name: Notarize and staple the app
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          ditto -c -k --keepParent "dist/$APP_NAME.app" "$RUNNER_TEMP/notarize-app.zip"
          scripts/notarize.sh "$RUNNER_TEMP/notarize-app.zip" "dist/$APP_NAME.app"

      - name: Package DMG
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          scripts/make-dmg.sh "dist/$APP_NAME.app" "dist/Tallshot-$VERSION.dmg"
          if [ "$HAS_SIGNING" = "true" ]; then
            codesign --sign "Developer ID Application" --timestamp "dist/Tallshot-$VERSION.dmg"
          fi

      - name: Notarize and staple the DMG
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          ASC_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          export ASC_KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          scripts/notarize.sh "dist/Tallshot-$VERSION.dmg"

      - name: Verify Developer ID signature and notarization
        if: env.HAS_SIGNING == 'true' && env.HAS_NOTARY == 'true'
        env:
          VERSION: ${{ steps.v.outputs.version }}
        run: |
          codesign -dv --verbose=2 "dist/$APP_NAME.app" 2>&1 | grep -E "^Authority|flags="
          spctl --assess --type execute --verbose=2 "dist/$APP_NAME.app"
          spctl --assess --type open --context context:primary-signature --verbose=2 "dist/Tallshot-$VERSION.dmg"
          xcrun stapler validate "dist/$APP_NAME.app"
          xcrun stapler validate "dist/Tallshot-$VERSION.dmg"

      - name: Checksums
        run: (cd dist && shasum -a 256 *.dmg > SHA256SUMS.txt && cat SHA256SUMS.txt)

      - name: Release notes
        run: |
          cp docs/RELEASE_NOTES.md dist/notes.md
          if [ "$HAS_SIGNING" != "true" ] || [ "$HAS_NOTARY" != "true" ]; then
            printf '\n' >> dist/notes.md
            cat docs/UNSIGNED_NOTE.md >> dist/notes.md
          fi

      - name: Keep the release files for the publish job
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: release-files
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
            dist/notes.md
          if-no-files-found: error
          retention-days: 7

      # Runs even when a step above failed or the run was cancelled.
      - name: Remove the signing keychain and the API key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/AuthKey.p8" "$RUNNER_TEMP/cert.p12" Config/Signing.xcconfig

  # Creates the GitHub release from the build job's files. Only on a pushed tag; a manual
  # (dry) run never gets here. No signing key or Apple secret is available in this job.
  publish:
    needs: build
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: release-files
          path: dist

      - name: Publish GitHub release (skipped if the release already exists)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ needs.build.outputs.version }}
          PRERELEASE: ${{ needs.build.outputs.prerelease }}
        run: |
          if gh release view "$GITHUB_REF_NAME" >/dev/null 2>&1; then
            echo "Release $GITHUB_REF_NAME already exists; leaving it as published."
            exit 0
          fi
          FLAGS=()
          [ "$PRERELEASE" = "true" ] && FLAGS+=(--prerelease)
          gh release create "$GITHUB_REF_NAME" dist/*.dmg dist/SHA256SUMS.txt "${FLAGS[@]}" \
            --verify-tag --title "Tallshot $VERSION" --notes-file dist/notes.md
