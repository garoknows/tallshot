name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          fetch-depth: 0   # the secret scan reads the commits being pushed
          persist-credentials: false

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Stitching engine tests and offscreen AppKit harness (TallshotCore)
        run: swift test -c release --package-path Packages/TallshotCore

      - name: Signing check tests
        run: scripts/test-signing-check.sh

      - name: Generate the Xcode project from project.yml
        run: |
          PATH="$(scripts/install-xcodegen.sh "$RUNNER_TEMP/xcodegen"):$PATH"
          xcodegen generate

      - name: Build app (Release, ad hoc signed)
        run: |
          xcodebuild -project Tallshot.xcodeproj -scheme Tallshot \
            -configuration Release -destination "generic/platform=macOS" \
            -derivedDataPath build.nosync/dd build

      - name: App icon (compiled from the Icon Composer file)
        run: |
          R=build.nosync/dd/Build/Products/Release/Tallshot.app/Contents/Resources
          ls -l "$R"
          test -f "$R/Assets.car"
          test -f "$R/AppIcon.icns"
          xcrun --sdk macosx assetutil --info "$R/Assets.car" | grep -E '"(AssetType|Name|Appearance)"' | sort | uniq -c
          mkdir -p icon-check
          cp "$R/AppIcon.icns" icon-check/
          I="$(xcode-select -p)/../Applications/Icon Composer.app/Contents/Executables/ictool"
          for r in Default Dark ClearLight ClearDark TintedLight TintedDark; do
            "$I" App/Resources/AppIcon.icon --export-image --output-file "icon-check/$r.png" --platform macOS --rendition "$r" --width 512 --height 512 --scale 1 || true
          done

      - name: Keep the compiled icon for checking
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: icon-check
          path: icon-check
          retention-days: 7

      - name: Privacy checks (no entitlements, no network, no temp files, no third-party code)
        run: scripts/check-privacy.sh build.nosync/dd/Build/Products/Release/Tallshot.app

      - name: Pointer and text-capture rules
        run: scripts/check-capture-rules.sh

      - name: The menu shows the build's version
        run: scripts/test-version.sh build.nosync/dd/Build/Products/Release/Tallshot.app

      - name: Secret scan
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
