name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: macos-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0   # the secret scan reads the commits being pushed

      - name: Show toolchain
        run: |
          sw_vers
          xcodebuild -version
          swift --version

      - name: Stitching engine tests and offscreen AppKit harness (TallshotCore)
        run: swift test -c release --package-path Packages/TallshotCore

      - name: Generate the Xcode project from project.yml
        run: |
          brew install xcodegen
          xcodegen generate

      - name: Build app (Release, ad hoc signed)
        run: |
          xcodebuild -project Tallshot.xcodeproj -scheme Tallshot \
            -configuration Release -destination "generic/platform=macOS" \
            -derivedDataPath build.nosync/dd build

      - name: Privacy checks (no entitlements, no network, no temp files, no third-party code)
        run: scripts/check-privacy.sh build.nosync/dd/Build/Products/Release/Tallshot.app

      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
