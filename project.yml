name: Tallshot
options:
  bundleIdPrefix: io.github.garoknows
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  groupSortPosition: top

configFiles:
  Debug: Config/Base.xcconfig
  Release: Config/Base.xcconfig

settings:
  base:
    SWIFT_VERSION: "6.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "2"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    DEAD_CODE_STRIPPING: YES
    ENABLE_USER_SCRIPT_SANDBOXING: YES

packages:
  TallshotCore:
    path: Packages/TallshotCore

targets:
  Tallshot:
    type: application
    platform: macOS
    sources:
      - App/Sources
      # Xcode compiles this Icon Composer file into Assets.car (light, dark, tinted, clear) and a
      # plain AppIcon.icns for older macOS. App/Resources/AppIcon.icns is only for build-direct.sh.
      - path: App/Resources/AppIcon.icon
        type: file
        buildPhase: resources
    dependencies:
      - package: TallshotCore
        product: TallshotCore
      - package: TallshotCore
        product: TallshotExport
    settings:
      base:
        PRODUCT_NAME: Tallshot
        PRODUCT_BUNDLE_IDENTIFIER: io.github.garoknows.tallshot
        CODE_SIGN_ENTITLEMENTS: App/Tallshot.entitlements
        INFOPLIST_FILE: App/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  Tallshot:
    build:
      targets:
        Tallshot: all
    test:
      targets:
        - package: TallshotCore/TallshotCoreTests
        - package: TallshotCore/TallshotHarnessTests
        - package: TallshotCore/TallshotExportTests
    archive:
      config: Release
